spring.datasource.url=jdbc:mysql://localhost:3306/traffic_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=ilyas
spring.datasource.password=MyPass123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL connection pool settings (Tomcat JDBC Pool instead of HikariCP)
spring.datasource.tomcat.initial-size=2
spring.datasource.tomcat.max-active=10
spring.datasource.tomcat.max-idle=10
spring.datasource.tomcat.min-idle=2
spring.datasource.tomcat.test-on-borrow=true
spring.datasource.tomcat.validation-query=SELECT 1

server.port=8080
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

# Push a fresh snapshot to all WS clients every 5 s
dashboard.push.interval-ms=5000
dashboard.zone-id=MAIN-STREET-ROTARY